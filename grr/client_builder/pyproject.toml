[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grr-response-client-builder"
version = "4.0.0.post0"
description = "GRR Rapid Response"
license = "Apache-2.0"
maintainers = [
  {name = "GRR Development Team", email = "grr-dev@googlegroups.com"},
]
requires-python = ">=3.9"
dependencies = [
  "distro==1.9.0",
  "fleetspeak-client-bin==0.1.13",
  "grr-response-client==4.0.0.post0",
  "grr-response-core==4.0.0.post0",
  "olefile==0.46",
  "PyInstaller==6.19.0",
]

[project.urls]
Homepage = "https://github.com/google/grr"

[project.scripts]
grr_client_build = "grr_response_client_builder.distro_entry:ClientBuild"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["grr_response_client_builder*"]
namespaces = true
