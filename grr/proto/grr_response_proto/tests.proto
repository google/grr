message VersionedTestStructV1 {
  optional bool bool1 = 1 [default = false];
}

message VersionedTestStructV2 {
  optional bool bool1 = 1 [default = false];
  optional bool bool2 = 2 [default = false];
}

message TestStructWithBool {
  optional bool foo = 1 [default = false];
}

message TestStructWithEnum {
  enum Foo {
    UNKNOWN = 0;
    ONE = 1;
    TWO = 2;
  }
  optional Foo foo = 1 [default = UNKNOWN];
}

message PartialTest1 {
  optional int64 int_val = 2;
}

message DynamicTypeTest {
  optional string type = 1 [
    default = "TestStruct",
    (sem_type) = {
      description: "A string value",
    }
  ];
  optional bytes dynamic = 2 [(sem_type) = {
    dynamic_type: "GetDynamicType",
    description: "A dynamic value based on another field.",
  }];
  optional User nested = 3;
}

message DynamicAnyValueTypeTest {
  optional string type = 1 [(sem_type) = {
    description: "A string value",
  }];
  optional google.protobuf.Any dynamic = 2 [(sem_type) = {
    dynamic_type: "GetDynamicType",
    description: "A dynamic value based on another field.",
  }];
}

message AnyValueWithoutTypeFunctionTest {
  optional google.protobuf.Any dynamic = 1 [(sem_type) = {
    description: "A dynamic value.",
  }];
}

message UndefinedYet {
  optional string foobar = 1 [(sem_type) = {
    description: "A string value",
  }];
}

message LateBindingTest {
  optional UndefinedYet nested = 1;
  optional string rdfvalue = 6 [(sem_type) = {
    type: "UndefinedRDFValue",
    description: "An undefined RDFValue field.",
  }];
  repeated string repeated = 7 [(sem_type) = {
    type: "UndefinedRDFValue2",
    description: "An undefined RDFValue field.",
  }];
}

message UnionTest {
  option (semantic) = {
    union_field: "struct_flavor",
  };

  enum Type {
    UNSPECIFIED = 0;
    FIRST = 1;
    SECOND = 2;
    THIRD = 3;
  }
  optional Type struct_flavor = 1 [
    default = THIRD,
    (sem_type) = {
      description: "An union enum field",
    }
  ];
  optional float first = 2 [
    default = 1.1,
    (sem_type) = {
      description: "A float number",
    }
  ];
  optional string second = 3 [
    default = "string",
    (sem_type) = {
      description: "A string value",
    }
  ];
  optional int64 third = 4 [
    default = 5,
    (sem_type) = {
      description: "An integer value",
    }
  ];
}

message FooStruct {
  optional bytes data = 1;
}

message BarStruct {
  optional bytes data = 1 [(sem_type) = {
    type: "RDFBytes",
  }];
}

message TestStructWithRDFInteger {
  optional int64 test = 1 [
    default = 0,
    (sem_type) = {
      type: "RDFInteger",
    }
  ];
