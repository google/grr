[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grr-api-client"
version = "4.0.0.post0"
description = "GRR API client library"
readme = "README.md"
license = "Apache-2.0"
maintainers = [
  {name = "GRR Development Team", email = "grr-dev@googlegroups.com"},
]
requires-python = ">=3.9"
dependencies = [
  "grr-response-proto==4.0.0.post0",
  # Note: grr-api-client might very much be used as a library and
  # therefore shouldn't pin dependencies that might be shared with other
  # pip packages.
  "cryptography>=3.3.2",
  "requests>=2.25.1,<3",
  "Werkzeug>=2.1.2,<3",
]

[project.optional-dependencies]
shell = [
  "ipython==7.15.0",
]

[project.urls]
Homepage = "https://github.com/google/grr/tree/master/api_client/python"

[project.scripts]
grr_api_shell = "grr_api_client.api_shell:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["grr_api_client*"]
namespaces = true
